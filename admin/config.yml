# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: wogns12090-prog/boaz-website
  branch: main
  identity_url: https://auth.decapbridge.com/sites/52da4e19-773e-4588-b538-48d29e34e2b7
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://wogns12090-prog.github.io/boaz-website

media_folder: "/assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "popup"
    label: "팝업 관리"
    files:
      - name: "popup"
        label: "홈페이지 팝업"
        file: "data/popup.json"
        fields:
          # '팝업 추가' 버튼으로 개수 제한 없이 등록할 수 있고, 항목을 끌어 순서를 바꿀 수 있습니다.
          # 표시 순서는 아래 '표시 순서' 숫자를 기준으로 정해집니다.
          # 복제: Decap CMS의 목록 위젯은 항목별 복제 버튼을 제공하지 않습니다
          # (ListItemTopBar가 삭제·순서변경만 지원). 아래 hint로 대체 방법을 안내합니다.
          - label: "팝업 목록"
            name: "popups"
            add_to_top: true
            widget: "list"
            label_singular: "팝업"
            allow_add: true
            collapsed: false
            summary: "{{fields.order}}. {{fields.title}}"
            hint: "팝업 복제 방법 — ① 아래 '팝업 추가'를 누르면 사용 여부·순서·표시 위치·너비가 기본값으로 채워진 새 팝업이 생깁니다. ② 복사하려는 팝업을 펼쳐 제목·내용·버튼 칸의 글자를 복사해 새 팝업에 붙여넣고, 이미지는 '이미지 추가'로 같은 파일을 다시 선택하면 됩니다. ③ 팝업 고유 ID는 반드시 다른 값으로 바꿔주세요(같으면 '오늘 하루 보지 않기' 기록이 섞입니다)."
            fields:
              - {label: "팝업 고유 ID (다른 팝업과 겹치지 않게, 예: notice-2026-08)", name: "id", widget: "string", hint: "한 번 정하면 바꾸지 마세요. '오늘 하루 보지 않기' 기록을 팝업별로 구분하는 값입니다."}
              - {label: "이 팝업 사용", name: "enabled", widget: "boolean", default: true, hint: "끄면 이 팝업만 표시되지 않습니다."}
              - {label: "표시 순서 (숫자, 작을수록 먼저)", name: "order", widget: "number", value_type: "int", default: 1}
              - {label: "제목", name: "title", widget: "string", required: false}
              - {label: "내용 (줄바꿈 그대로 표시됩니다)", name: "content", widget: "text", required: false}
              # media_folder는 반드시 '/'로 시작해야 한다. 상대경로로 쓰면 Decap이 대상 파일 위치
              # (data/)를 기준으로 해석해 data/assets/uploads/... 로 잘못 저장된다.
              # public_folder는 '/' 없이 두어야 GitHub Pages 프로젝트 경로(/boaz-website/)에서 정상 동작한다.
              - label: "이미지 (여러 장 등록 가능, 등록한 순서대로 위에서 아래로 표시)"
                name: "images"
                widget: "list"
                required: false
                label_singular: "이미지"
                allow_add: true
                summary: "{{fields.alt}}"
                fields:
                  - {label: "이미지 파일", name: "src", widget: "image", media_folder: "/assets/uploads/popup", public_folder: "assets/uploads/popup"}
                  - {label: "대체텍스트 (이미지가 안 보일 때 표시되는 설명)", name: "alt", widget: "string", required: false}
              - {label: "버튼 글자", name: "buttonText", widget: "string", required: false, default: "바로가기", hint: "비워두면 '바로가기'로 표시됩니다. 버튼 주소가 비어 있으면 버튼 자체가 나오지 않습니다."}
              - {label: "버튼 주소 (선택, 예: biz-air.html 또는 https://...)", name: "buttonUrl", widget: "string", required: false}
              - {label: "표시 시작일 (선택, 비우면 바로 표시)", name: "startDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
              - {label: "표시 종료일 (선택, 비우면 계속 표시)", name: "endDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
              - {label: "표시 위치", name: "showOn", widget: "select", default: "home", options: [{label: "메인페이지만", value: "home"}, {label: "모든 페이지", value: "all"}]}
              - {label: "PC 팝업 너비 (px)", name: "maxWidth", widget: "number", value_type: "int", default: 600, min: 320, max: 900, required: false, hint: "비워두면 600px이 적용됩니다. 화면보다 크면 자동으로 줄어듭니다."}
              - {label: "모바일 팝업 너비 (px)", name: "maxWidthMobile", widget: "number", value_type: "int", default: 340, min: 240, max: 480, required: false, hint: "비워두면 340px이 적용됩니다. 좌우 여백은 항상 확보됩니다."}
              - {label: "PC 팝업 높이 (px)", name: "maxHeight", widget: "number", value_type: "int", default: 720, min: 300, max: 1200, required: false, hint: "비워두면 720px이 적용됩니다. 내용이 더 길면 팝업이 늘어나지 않고 본문만 스크롤됩니다."}
              - {label: "모바일 팝업 높이 (px)", name: "maxHeightMobile", widget: "number", value_type: "int", default: 560, min: 260, max: 900, required: false, hint: "비워두면 560px이 적용됩니다. 화면 높이를 넘지 않도록 자동으로 제한됩니다."}

  - name: "reviews"
    label: "이용후기 (BZ REVIEW)"
    files:
      - name: "reviews"
        label: "이용후기 목록"
        file: "data/reviews.json"
        fields:
          - label: "후기 목록"
            name: "reviews"
            add_to_top: true
            widget: "list"
            summary: "{{fields.title}} — {{fields.author}} ({{fields.rating}}점)"
            fields:
              - {label: "ID (숫자, 겹치지 않게)", name: "id", widget: "string"}
              - {label: "사진 (선택, 안 올리면 기본 배경 사용)", name: "image", widget: "image", required: false, media_folder: "/assets/uploads/reviews", public_folder: "assets/uploads/reviews"}
              - {label: "별점 (1~5)", name: "rating", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "요약 (목록 카드에 짧게 보이는 글)", name: "summary", widget: "text"}
              - label: "본문 (글/사진 블록을 원하는 순서로 추가하세요)"
                name: "content"
                widget: "list"
                required: false
                types:
                  - label: "글"
                    name: "text"
                    widget: "object"
                    summary: "글: {{fields.value}}"
                    fields:
                      - {label: "내용", name: "value", widget: "text"}
                  - label: "사진"
                    name: "image"
                    widget: "object"
                    summary: "사진: {{fields.caption}}"
                    fields:
                      - {label: "사진", name: "img", widget: "image"}
                      - {label: "설명 (선택)", name: "caption", widget: "string", required: false}
              - {label: "작성자 (예: 김OO 팀장)", name: "author", widget: "string"}
              - {label: "업종", name: "industry", widget: "string"}
              - {label: "지역", name: "region", widget: "string"}
              - {label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "관리자 답글 (선택, 비워두면 안 보임)", name: "reply", widget: "text", required: false}
              - {label: "답글 날짜 (선택)", name: "replyDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}

  - name: "stories"
    label: "BZ STORY (소식)"
    files:
      - name: "stories"
        label: "소식 목록"
        file: "data/stories.json"
        fields:
          - label: "소식 목록"
            name: "stories"
            add_to_top: true
            widget: "list"
            summary: "[{{fields.category}}] {{fields.title}}"
            fields:
              - {label: "ID (숫자, 겹치지 않게)", name: "id", widget: "string"}
              - {label: "카테고리", name: "category", widget: "select", options: ["환경뉴스", "회사소식"]}
              - {label: "사진 (선택, 안 올리면 기본 배경 사용)", name: "image", widget: "image", required: false, media_folder: "/assets/uploads/stories", public_folder: "assets/uploads/stories"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "요약 (목록 카드에 짧게 보이는 글)", name: "summary", widget: "text"}
              - label: "본문 (글/사진 블록을 원하는 순서로 추가하세요)"
                name: "content"
                widget: "list"
                required: false
                types:
                  - label: "글"
                    name: "text"
                    widget: "object"
                    summary: "글: {{fields.value}}"
                    fields:
                      - {label: "내용", name: "value", widget: "text"}
                  - label: "사진"
                    name: "image"
                    widget: "object"
                    summary: "사진: {{fields.caption}}"
                    fields:
                      - {label: "사진", name: "img", widget: "image"}
                      - {label: "설명 (선택)", name: "caption", widget: "string", required: false}
              - {label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "조회수 (숫자만, 처음엔 0으로 시작해도 됨)", name: "views", widget: "string", default: "0"}

  - name: "customers"
    label: "고객사 관리"
    files:
      - name: "customers"
        label: "고객사 목록"
        file: "data/customers.json"
        fields:
          - label: "고객사 목록"
            name: "customers"
            add_to_top: true
            widget: "list"
            summary: "{{fields.order}}. {{fields.name}}"
            fields:
              - {label: "회사명", name: "name", widget: "string"}
              - {label: "로고 (선택, 안 올리면 회사명만 표시)", name: "logo", widget: "image", required: false, media_folder: "/assets/logos/customers", public_folder: "assets/logos/customers"}
              - {label: "홈페이지 주소 (선택, 있으면 클릭 시 새 창으로 열림)", name: "url", widget: "string", required: false}
              - {label: "노출 순서 (숫자, 작을수록 먼저 표시)", name: "order", widget: "number", value_type: "int", default: 1}
              - {label: "공개 여부 (끄면 어디에도 안 보임)", name: "visible", widget: "boolean", default: true}
              - {label: "메인페이지 노출 여부", name: "showOnMain", widget: "boolean", default: true}

  - name: "partners"
    label: "협력사 관리"
    files:
      - name: "partners"
        label: "협력사 목록"
        file: "data/partners.json"
        fields:
          - label: "협력사 목록"
            name: "partners"
            add_to_top: true
            widget: "list"
            summary: "{{fields.order}}. {{fields.name}}"
            fields:
              - {label: "회사명", name: "name", widget: "string"}
              - {label: "로고 (선택, 안 올리면 회사명만 표시)", name: "logo", widget: "image", required: false, media_folder: "/assets/logos/partners", public_folder: "assets/logos/partners"}
              - {label: "홈페이지 주소 (선택, 있으면 클릭 시 새 창으로 열림)", name: "url", widget: "string", required: false}
              - {label: "노출 순서 (숫자, 작을수록 먼저 표시)", name: "order", widget: "number", value_type: "int", default: 1}
              - {label: "공개 여부 (끄면 어디에도 안 보임)", name: "visible", widget: "boolean", default: true}
              - {label: "메인페이지 노출 여부", name: "showOnMain", widget: "boolean", default: true}
